---
apiVersion: v1
kind: Namespace
metadata:
  name: promai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promai-config
  namespace: promai
data:
  config.yaml: |
    prometheus_url: "http://prometheus.monitoring:9090"
    prometheus_username: ""
    prometheus_password: ""

    project_name: "PromAI 巡检报告"

    auth:
      username: "admin"
      password: "promai2024"
      jwt_secret: "change-me-in-production"

    cron_schedule: "00 09,17 * * *"

    report_cleanup:
      enabled: true
      max_age: 7
      cron_schedule: "0 0 * * *"

    notifications:
      wechat_work:
        enabled: true
        webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your-key"
        report_url: "https://promai.your-company.com"

    metric_types:
      - type: "基础资源"
        metrics:
          - name: "CPU 使用率"
            query: "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)"
            threshold: 80
            threshold_type: "greater"
            unit: "%"

          - name: "内存使用率"
            query: "100 - ((node_memory_MemAvailable_bytes * 100) / node_memory_MemTotal_bytes)"
            threshold: 85
            threshold_type: "greater"
            unit: "%"

          - name: "磁盘使用率"
            query: "(100 - (node_filesystem_avail_bytes * 100 / node_filesystem_size_bytes{mountpoint='/'})) and ON (instance) node_uname_info"
            threshold: 85
            threshold_type: "greater"
            unit: "%"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: promai-data
  namespace: promai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promai
  namespace: promai
  labels:
    app: promai
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: promai
  template:
    metadata:
      labels:
        app: promai
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: promai
          image: promai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8091
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: reports
              mountPath: /app/reports
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /api/promai
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/promai
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: promai-config
        - name: data
          persistentVolumeClaim:
            claimName: promai-data
        - name: reports
          persistentVolumeClaim:
            claimName: promai-data
            subPath: reports

---
apiVersion: v1
kind: Service
metadata:
  name: promai
  namespace: promai
  labels:
    app: promai
spec:
  type: ClusterIP
  ports:
    - port: 8091
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: promai

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: promai
  namespace: promai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: promai.your-company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: promai
                port:
                  name: http
  tls:
    - hosts:
        - promai.your-company.com
      secretName: promai-tls
