stages:
  - build
  - dockerize
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# =============================================
# Stage: Build
# =============================================
build-backend:
  stage: build
  image: golang:1.25-alpine
  tags:
    - go
  before_script:
    - apk add --no-cache gcc musl-dev
  script:
    - go mod download
    - CGO_ENABLED=1 go build -ldflags="-s -w" -o PromAI .
  artifacts:
    paths:
      - PromAI
    expire_in: 1 hour
  cache:
    key: go-modules
    paths:
      - /go/pkg/mod/
  only:
    - main
    - tags

build-frontend:
  stage: build
  image: node:20-alpine
  tags:
    - node
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
  cache:
    key: frontend-modules
    paths:
      - frontend/node_modules/
  only:
    - main
    - tags

# =============================================
# Stage: Docker
# =============================================
docker-build:
  stage: dockerize
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - docker
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from $DOCKER_IMAGE_LATEST
      -t $DOCKER_IMAGE
      -t $DOCKER_IMAGE_LATEST
      .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  needs:
    - build-backend
    - build-frontend
  only:
    - main
    - tags

# =============================================
# Stage: Deploy to K8s
# =============================================
.deploy-k8s: &deploy-k8s
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - k8s
  script:
    - kubectl set image deployment/promai promai=$DOCKER_IMAGE -n promai --record
    - kubectl rollout status deployment/promai -n promai --timeout=120s
  only:
    - main

deploy-dev:
  <<: *deploy-k8s
  variables:
    KUBECONFIG: $KUBECONFIG_DEV
  environment:
    name: dev
  only:
    - main

deploy-prod:
  <<: *deploy-k8s
  variables:
    KUBECONFIG: $KUBECONFIG_PROD
  environment:
    name: production
  only:
    - tags
  when: manual
