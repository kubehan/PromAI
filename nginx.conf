server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # 后端 API
    location /api/promai/ {
        proxy_pass http://promai:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 报告静态文件
    location /reports/ {
        proxy_pass http://promai:8091;
        proxy_set_header Host $host;
    }

    # 前端 SPA
    location /promai/ {
        alias /usr/share/nginx/html/promai/;
        try_files $uri $uri/ /promai/index.html;
    }

    # 根路径重定向到 /promai/
    location / {
        return 302 /promai/;
    }
}
