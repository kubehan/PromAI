<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能自动化巡检平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .dashboard-info {
            background: #f8f9fa;
            padding: 20px 40px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .info-value {
            font-weight: 600;
            color: #495057;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online {
            background-color: #28a745;
            animation: pulse 2s infinite;
        }

        .status-warning {
            background-color: #ffc107;
        }

        .status-offline {
            background-color: #dc3545;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(40, 167, 69, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0);
            }
        }

        main {
            padding: 40px;
        }

        .function-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .function-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .function-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .function-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .function-card:hover::before {
            transform: scaleX(1);
        }

        .function-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
        }

        .function-card h3 {
            font-size: 1.3em;
            margin-bottom: 10px;
            color: #333;
        }

        .function-card p {
            color: #6c757d;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .function-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .function-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .function-btn:active {
            transform: scale(0.98);
        }

        .function-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            font-size: 0.8em;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .recent-activity {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
        }

        .recent-activity h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }

        .activity-list {
            list-style: none;
        }

        .activity-item {
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .activity-icon.success {
            background: #d4edda;
            color: #155724;
        }

        .activity-icon.warning {
            background: #fff3cd;
            color: #856404;
        }

        .activity-icon.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .activity-content {
            flex-grow: 1;
        }

        .activity-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .activity-subtitle {
            font-size: 0.9em;
            color: #667eea;
            margin-bottom: 4px;
        }

        .activity-time {
            font-size: 0.85em;
            color: #6c757d;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn.secondary {
            background: #e9ecef;
            color: #495057;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .dashboard-info {
                justify-content: center;
            }

            .function-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>PromAI</h1>
            <p>智能自动化巡检平台</p>
        </header>

        <div class="dashboard-info">
            <div class="info-item">
                <span class="status-indicator status-online"></span>
                <span class="info-label">服务状态:</span>
                <span class="info-value">正常</span>
            </div>
            <div class="info-item">
                <span class="status-indicator status-online"></span>
                <span class="info-label">服务负责人:</span>
                <span class="info-value">Kubehan</span>
            </div>
            <div class="info-item">
                <span class="status-indicator status-online"></span>
                <span class="info-label">服务版本:</span>
                <span class="info-value">v1.0.0</span>
            </div>
        </div>

        <main>
            <section class="function-grid">
                <div class="function-card" onclick="window.location.href='/api/promai/status'">
                    <div class="function-icon">💚</div>
                    <h3>健康看板</h3>
                    <p>查看集群当前健康状态和性能指标</p>
                    <button class="function-btn">进入看板</button>
                </div>

                <div class="function-card" onclick="window.location.href='/api/promai/reports/history'">
                    <div class="function-icon">📄</div>
                    <div class="function-badge">定时清理</div>
                    <h3>历史报告</h3>
                    <p>查看和管理历史巡检报告，可下载</p>
                    <button class="function-btn">查看报告</button>
                </div>

                <div class="function-card" onclick="showModal('inspect')">
                    <div class="function-icon">🔍</div>
                    <h3>开始巡检</h3>
                    <p>输入自定义URL，生成详细报告</p>
                    <button class="function-btn">立即巡检</button>
                </div>

                <div class="function-card" onclick="window.location.href='/api/promai/progress'">
                    <div class="function-badge">重启清零</div>
                    <div class="function-icon">📊</div>
                    <h3>巡检进度</h3>
                    <p>查看巡检任务的执行进度和状态</p>
                    <button class="function-btn">查看进度</button>
                </div>
            </section>

            <section class="recent-activity">
                <h2>最近活动</h2>
                <ul id="activityList" class="activity-list">
                    <!-- 活动列表将通过JavaScript动态加载 -->
                </ul>
                <div id="activityEmpty" class="empty-state"
                    style="display: none; text-align: center; padding: 40px; color: #6c757d;">
                    <p>暂无最近活动</p>
                </div>
            </section>
        </main>
    </div>

    <!-- 模态框 -->
    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modalTitle">确认操作</h2>
            <p id="modalMessage">您确定要执行此操作吗？</p>
            <div class="modal-buttons">
                <button class="modal-btn primary" id="modalConfirm">确认</button>
                <button class="modal-btn secondary" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 更新最后巡检时间
        function updateLastInspectTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastInspect').textContent = timeString;
        }

        // 显示模态框
        function showModal(action) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalConfirm = document.getElementById('modalConfirm');

            switch (action) {
                case 'inspect':
                    modalTitle.textContent = '开始巡检';
                    modalMessage.innerHTML = `
                        <div style="text-align: left; margin-bottom: 20px;">
                            <p>请选择数据源进行巡检：</p>
                            <select id="datasourceSelect" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                                <option value="">默认数据源</option>
                                <option value="prometheus-dev">开发环境</option>
                                <option value="prometheus-prod">生产环境</option>
                                <option value="custom">自定义URL</option>
                            </select>
                            <input type="text" id="customUrl" placeholder="请输入Prometheus URL" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; display: none;">
                            <p style="margin-top: 15px;">企业微信通知：可选</p>
                            <input type="text" id="wechatBotKey" placeholder="请输入企业微信机器人key（可选）" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                            <p style="margin-top: 15px;">巡检人员企业微信邮箱：可选</p>
                            <input type="text" id="toUser" placeholder="请输入企业邮箱，如 kubehan@kubehan.cn" style="width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                    `;
                    modalConfirm.textContent = '开始巡检';

                    // 处理数据源选择
                    setTimeout(() => {
                        const select = document.getElementById('datasourceSelect');
                        const customUrl = document.getElementById('customUrl');

                        select.onchange = function () {
                            if (this.value === 'custom') {
                                customUrl.style.display = 'block';
                            } else {
                                customUrl.style.display = 'none';
                            }
                        };
                    }, 100);

                    modalConfirm.onclick = () => {
                        const select = document.getElementById('datasourceSelect');
                        const customUrl = document.getElementById('customUrl');
                        const wechatBotKey = document.getElementById('wechatBotKey');
                        const toUser = document.getElementById('toUser');
                        let datasource = '';

                        if (select.value === 'custom') {
                            datasource = customUrl.value;
                            if (!datasource) {
                                alert('请输入Prometheus URL');
                                return;
                            }
                        } else if (select.value) {
                            datasource = select.value;
                        }

                        // 触发巡检
                        startInspection(datasource, wechatBotKey.value, toUser.value);
                        closeModal();
                    };
                    break;
            }

            modal.style.display = 'block';
        }

        // 开始巡检
        function startInspection(datasource, wechatBotKey, toUser) {
            // 显示进度提示
            const progressDiv = document.createElement('div');
            progressDiv.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #667eea; color: white; padding: 15px 20px; border-radius: 10px; z-index: 9999;';
            progressDiv.innerHTML = '⏳ 正在启动巡检任务...';
            document.body.appendChild(progressDiv);

            // 先创建任务
            fetch('/api/promai/tasks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: '系统巡检任务',
                    datasource: datasource || '默认数据源'
                })
            })
                .then(response => response.json())
                .then(task => {
                    progressDiv.innerHTML = '✅ 巡检任务已创建，正在执行...';

                    // 构建实际执行巡检的URL，包含taskID
                    let url = '/api/promai/getreport';
                    const params = new URLSearchParams();
                    if (datasource) {
                        params.append('datasource', datasource);
                    }
                    params.append('taskid', task.id);
                    if (wechatBotKey) {
                        params.append('wechat_bot_key', wechatBotKey);
                    }
                    if (toUser) {
                        params.append('touser', toUser);
                    }
                    if (params.toString()) {
                        url += '?' + params.toString();
                    }

                    // 发送实际巡检请求
                    fetch(url)
                        .then(response => {
                            if (response.redirected) {
                                progressDiv.innerHTML = '✅ 巡检完成！正在生成报告...';
                                setTimeout(() => {
                                    window.location.href = response.url;
                                }, 1000);
                            } else {
                                throw new Error('巡检失败');
                            }
                        })
                        .catch(error => {
                            progressDiv.style.background = '#dc3545';
                            progressDiv.innerHTML = '❌ 巡检失败：' + error.message;
                            setTimeout(() => {
                                progressDiv.remove();
                            }, 3000);
                        });
                })
                .catch(error => {
                    console.error('Error:', error);
                    progressDiv.style.background = '#dc3545';
                    progressDiv.innerHTML = '❌ 创建巡检任务失败';
                    setTimeout(() => {
                        progressDiv.remove();
                    }, 3000);
                });

            // 更新最后巡检时间
            updateLastInspectTime();
        }

        // 关闭模态框
        function closeModal(event) {
            if (!event || event.target.id === 'modal') {
                document.getElementById('modal').style.display = 'none';
            }
        }

        // 加载最近活动
        function loadRecentActivities() {
            const activityList = document.getElementById('activityList');
            const activityEmpty = document.getElementById('activityEmpty');

            fetch('/api/promai/activities')
                .then(response => response.json())
                .then(activities => {
                    activityList.innerHTML = '';

                    if (activities.length === 0) {
                        activityList.style.display = 'none';
                        activityEmpty.style.display = 'block';
                        return;
                    }

                    activityList.style.display = 'block';
                    activityEmpty.style.display = 'none';

                    activities.forEach(activity => {
                        const li = document.createElement('li');
                        li.className = 'activity-item';

                        // 计算相对时间
                        const timeAgo = getTimeAgo(new Date(activity.time));

                        li.innerHTML = `
                            <div class="activity-icon ${activity.type}">${activity.icon}</div>
                            <div class="activity-content">
                                <div class="activity-title">${activity.title}</div>
                                <div class="activity-subtitle">${activity.datasource || ''}</div>
                                <div class="activity-time">${timeAgo}</div>
                            </div>
                        `;

                        activityList.appendChild(li);
                    });
                })
                .catch(error => {
                    console.error('Failed to load recent activities:', error);
                    activityList.style.display = 'none';
                    activityEmpty.style.display = 'block';
                });
        }

        // 计算相对时间
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);

            if (seconds < 60) return '刚刚';
            if (seconds < 3600) return Math.floor(seconds / 60) + '分钟前';
            if (seconds < 86400) return Math.floor(seconds / 3600) + '小时前';
            if (seconds < 2592000) return Math.floor(seconds / 86400) + '天前';

            return date.toLocaleDateString('zh-CN');
        }

        // 页面加载时的初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 加载最近活动
            loadRecentActivities();

            // 每30秒刷新一次活动数据
            setInterval(loadRecentActivities, 30000);

            // 添加键盘事件
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        });

        // 添加页面可见性检测，用于更新数据
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                // 页面变为可见时刷新数据
                console.log('页面可见，刷新数据...');
            }
        });
    </script>
</body>

</html>
