<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromAI 管理后台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f7fa; }
    #app { height: 100vh; display: flex; }
    .sidebar { width: 220px; background: #304156; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.1); }
    .sidebar-header h2 { font-size: 18px; font-weight: 600; }
    .sidebar-header p { font-size: 12px; opacity: .6; margin-top: 4px; }
    .sidebar-menu { flex: 1; padding: 10px 0; }
    .menu-item { padding: 14px 24px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; transition: all .2s; border-left: 3px solid transparent; }
    .menu-item:hover { background: rgba(255,255,255,.05); }
    .menu-item.active { background: rgba(255,255,255,.1); border-left-color: #409eff; color: #409eff; }
    .menu-item .icon { font-size: 18px; }
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { height: 60px; background: #fff; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
    .top-bar h3 { font-size: 16px; font-weight: 600; color: #303133; }
    .top-bar-actions { display: flex; align-items: center; gap: 12px; }
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #303133; }
    .stat-card .label { font-size: 13px; color: #909399; margin-top: 4px; }
    .page-section { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .page-header h4 { font-size: 15px; font-weight: 600; }
    .ds-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .ds-badge-default { background: #ecf5ff; color: #409eff; }
    .ds-badge-normal { background: #f0f9eb; color: #67c23a; }
    .inline-form { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .inline-form .el-input { width: 200px; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .tag-success { color: #67c23a; }
    .tag-danger { color: #f56c6c; }
    .tag-warning { color: #e6a23c; }
    .code-block { background: #f5f7fa; border-radius: 4px; padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; border: 1px solid #e4e7ed; }
    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .quick-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; background: #fff; border-radius: 8px; cursor: pointer; border: 1px solid #e4e7ed; transition: all .2s; }
    .quick-action-btn:hover { border-color: #409eff; box-shadow: 0 2px 12px rgba(64,158,255,.1); transform: translateY(-2px); }
    .quick-action-btn .qa-icon { font-size: 28px; }
    .quick-action-btn .qa-label { font-size: 13px; color: #606266; }
    .metric-group { margin-bottom: 16px; border: 1px solid #e4e7ed; border-radius: 8px; overflow: hidden; }
    .metric-group-header { padding: 12px 16px; background: #f5f7fa; font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4e7ed; }
    .metric-item { padding: 10px 16px; border-bottom: 1px solid #f2f2f2; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .metric-item:last-child { border-bottom: none; }
    .inline-code { background: #f5f7fa; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 12px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
    @media (max-width: 768px) { .sidebar { width: 60px; } .sidebar-header h2, .sidebar-header p, .menu-item span { display: none; } .menu-item { justify-content: center; padding: 14px; } .stats-cards { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>PromAI</h2>
        <p>管理后台</p>
      </div>
      <div class="sidebar-menu">
        <div v-for="item in menuItems" :key="item.key" class="menu-item" :class="{active: activeMenu === item.key}" @click="activeMenu = item.key">
          <span class="icon" v-html="item.icon"></span>
          <span>{{ item.label }}</span>
        </div>
      </div>
    </div>
    <div class="main-area">
      <div class="top-bar">
        <h3>{{ currentMenuLabel }}</h3>
        <div class="top-bar-actions">
          <el-button type="primary" size="small" @click="dialogInspectVisible = true">🚀 触发巡检</el-button>
          <el-button size="small" @click="handleRefresh">🔄 刷新</el-button>
          <el-button size="small" @click="goHome">← 返回首页</el-button>
        </div>
      </div>
      <div class="content-area">

        <!-- Dashboard -->
        <template v-if="activeMenu === 'dashboard'">
          <div class="quick-actions">
            <div class="quick-action-btn" @click="activeMenu = 'datasources'"><span class="qa-icon">📡</span><span class="qa-label">数据源</span></div>
            <div class="quick-action-btn" @click="activeMenu = 'notifications'"><span class="qa-icon">🔔</span><span class="qa-label">通知渠道</span></div>
            <div class="quick-action-btn" @click="activeMenu = 'cronjobs'"><span class="qa-icon">⏰</span><span class="qa-label">定时任务</span></div>
            <div class="quick-action-btn" @click="activeMenu = 'reports'"><span class="qa-icon">📄</span><span class="qa-label">报告管理</span></div>
            <div class="quick-action-btn" @click="activeMenu = 'metrics'"><span class="qa-icon">📊</span><span class="qa-label">指标配置</span></div>
          </div>
          <div class="stats-cards">
            <div class="stat-card"><div class="num">{{ stats.datasources }}</div><div class="label">数据源</div></div>
            <div class="stat-card"><div class="num">{{ stats.notifications }}</div><div class="label">通知渠道</div></div>
            <div class="stat-card"><div class="num">{{ stats.cronjobs }}</div><div class="label">定时任务</div></div>
            <div class="stat-card"><div class="num">{{ stats.reports }}</div><div class="label">报告总数</div></div>
            <div class="stat-card"><div class="num">{{ stats.metricTypes }}</div><div class="label">指标类型</div></div>
            <div class="stat-card"><div class="num">{{ stats.metricConfigs }}</div><div class="label">指标配置</div></div>
          </div>
          <div class="page-section">
            <div class="page-header"><h4>最近报告</h4></div>
            <el-table :data="recentReports" stripe style="width:100%" v-loading="loading.reports" @row-click="viewReport">
              <el-table-column prop="title" label="标题" min-width="160"></el-table-column>
              <el-table-column prop="datasource_name" label="数据源" min-width="200" show-overflow-tooltip></el-table-column>
              <el-table-column label="状态" width="80">
                <template #default="{row}"><el-tag :type="row.status === 'success' ? 'success' : row.status === 'warning' ? 'warning' : 'danger'" size="small">{{ {success:'正常',warning:'警告',danger:'严重'}[row.status] }}</el-tag></template>
              </el-table-column>
              <el-table-column prop="created_at" label="时间" width="160">
                <template #default="{row}">{{ formatTime(row.created_at) }}</template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- Data Sources -->
        <template v-if="activeMenu === 'datasources'">
          <div class="page-section">
            <div class="page-header">
              <h4>数据源管理</h4>
              <div>
                <el-button type="primary" size="small" @click="dsImportVisible = true">📥 导入YAML</el-button>
                <el-button type="primary" size="small" @click="dsDialogVisible = true; dsForm={}">➕ 新增数据源</el-button>
              </div>
            </div>
            <el-table :data="datasources" stripe style="width:100%" v-loading="loading.datasources">
              <el-table-column prop="name" label="名称" min-width="120">
                <template #default="{row}"><span>{{ row.name }}</span><el-tag v-if="row.is_default" size="small" type="primary" style="margin-left:6px">默认</el-tag></template>
              </el-table-column>
              <el-table-column prop="url" label="URL" min-width="250" show-overflow-tooltip></el-table-column>
              <el-table-column prop="username" label="用户名" width="120"></el-table-column>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{row}">
                  <el-button size="small" @click="editDS(row)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deleteDS(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- Notification Channels -->
        <template v-if="activeMenu === 'notifications'">
          <div class="page-section">
            <div class="page-header"><h4>通知渠道</h4><el-button type="primary" size="small" @click="notifyDialogVisible = true; notifyForm={}">➕ 新增渠道</el-button></div>
            <el-table :data="notifications" stripe style="width:100%" v-loading="loading.notifications">
              <el-table-column label="类型" width="80">
                <template #default="{row}">{{ {dingtalk:'钉钉',email:'邮件',wechat_work:'企微机器人',wechat_app:'企微应用',feishu:'飞书'}[row.channel_type] || row.channel_type }}</template>
              </el-table-column>
              <el-table-column prop="name" label="名称" min-width="120"></el-table-column>
              <el-table-column label="启用" width="80">
                <template #default="{row}"><el-switch v-model="row.enabled" @change="updateNotify(row)"></el-switch></template>
              </el-table-column>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{row}">
                  <el-button size="small" @click="editNotify(row)">编辑</el-button>
                  <el-button size="small" type="success" @click="testNotify(row)">测试</el-button>
                  <el-button size="small" type="danger" @click="deleteNotify(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- Cron Jobs -->
        <template v-if="activeMenu === 'cronjobs'">
          <div class="page-section">
            <div class="page-header"><h4>定时任务</h4><el-button type="primary" size="small" @click="cronDialogVisible = true; cronForm={enabled:true}">➕ 新增任务</el-button></div>
            <el-table :data="cronjobs" stripe style="width:100%" v-loading="loading.cronjobs">
              <el-table-column prop="name" label="名称" min-width="120"></el-table-column>
              <el-table-column prop="schedule" label="调度表达式" width="150"></el-table-column>
              <el-table-column label="启用" width="80">
                <template #default="{row}"><el-switch v-model="row.enabled" @change="updateCron(row)"></el-switch></template>
              </el-table-column>
              <el-table-column label="上次执行" width="160">
                <template #default="{row}">{{ row.last_run_at ? formatTime(row.last_run_at) : '从未执行' }}</template>
              </el-table-column>
              <el-table-column label="状态" width="80">
                <template #default="{row}"><el-tag v-if="row.last_status" :type="row.last_status === 'success' ? 'success' : 'danger'" size="small">{{ row.last_status === 'success' ? '成功' : '失败' }}</el-tag><span v-else>-</span></template>
              </el-table-column>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{row}">
                  <el-button size="small" @click="editCron(row)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deleteCron(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- Reports -->
        <template v-if="activeMenu === 'reports'">
          <div class="page-section">
            <div class="page-header"><h4>报告管理</h4></div>
            <el-table :data="reports" stripe style="width:100%" v-loading="loading.reports">
              <el-table-column prop="title" label="标题" min-width="160"></el-table-column>
              <el-table-column prop="datasource_name" label="数据源" min-width="200" show-overflow-tooltip></el-table-column>
              <el-table-column label="状态" width="80">
                <template #default="{row}"><el-tag :type="row.status === 'success' ? 'success' : row.status === 'warning' ? 'warning' : 'danger'" size="small">{{ {success:'正常',warning:'警告',danger:'严重'}[row.status] }}</el-tag></template>
              </el-table-column>
              <el-table-column label="指标数" width="80"><template #default="{row}">{{ row.total_metrics }}</template></el-table-column>
              <el-table-column label="告警" width="80"><template #default="{row}">{{ row.alert_count }}</template></el-table-column>
              <el-table-column label="时间" width="160"><template #default="{row}">{{ formatTime(row.created_at) }}</template></el-table-column>
              <el-table-column label="操作" width="200" fixed="right">
                <template #default="{row}">
                  <el-button size="small" type="primary" @click="viewReport(row)">查看</el-button>
                  <el-button size="small" type="danger" @click="deleteReport(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>
        </template>

        <!-- Metrics -->
        <template v-if="activeMenu === 'metrics'">
          <div class="page-section">
            <div class="page-header"><h4>指标配置</h4><el-button type="primary" size="small" @click="mtDialogVisible = true; mtForm={}">➕ 新增指标类型</el-button></div>
            <div v-for="mt in metricTypes" :key="mt.id" class="metric-group">
              <div class="metric-group-header">
                <span>{{ mt.type_name }}</span>
                <div>
                  <el-button size="small" @click="addMetricConfig(mt)">➕ 添加指标</el-button>
                  <el-button size="small" @click="editMetricType(mt)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deleteMetricType(mt)">删除</el-button>
                </div>
              </div>
              <div v-for="mc in mt.configs" :key="mc.id" class="metric-item">
                <div style="flex:1"><strong>{{ mc.name }}</strong><span v-if="mc.description" style="color:#909399;margin-left:8px;font-size:12px">{{ mc.description }}</span></div>
                <div style="display:flex;gap:10px;align-items:center">
                  <span class="inline-code">{{ mc.query }}</span>
                  <span style="font-size:12px;color:#909399">阈值: {{ mc.threshold }}{{ mc.unit }} ({{ mc.threshold_type }})</span>
                  <el-button size="small" @click="editMetricConfig(mc)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deleteMetricConfig(mc)">删除</el-button>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Settings -->
        <template v-if="activeMenu === 'settings'">
          <div class="page-section">
            <div class="page-header"><h4>系统设置</h4><el-button type="primary" size="small" @click="saveSettings">💾 保存设置</el-button></div>
            <el-form :model="settingsForm" label-width="140px" style="max-width:600px">
              <el-form-item label="项目名称"><el-input v-model="settingsForm.project_name" placeholder="PromAI"></el-input></el-form-item>
              <el-form-item label="定时调度"><el-input v-model="settingsForm.cron_schedule" placeholder="00 08,17 * * *"></el-input></el-form-item>
              <el-form-item label="自动清理报告"><el-switch v-model="settingsForm.report_cleanup_enabled_bool"></el-switch></el-form-item>
              <el-form-item label="报告保留天数"><el-input-number v-model="settingsForm.report_cleanup_max_age_num" :min="1" :max="90"></el-input-number></el-form-item>
              <el-form-item label="清理调度"><el-input v-model="settingsForm.report_cleanup_cron" placeholder="0 0 * * *"></el-input></el-form-item>
            </el-form>
          </div>
        </template>

      </div>
    </div>

    <!-- Inspect Dialog -->
    <el-dialog v-model="dialogInspectVisible" title="触发巡检" width="500px">
      <el-form :model="inspectForm" label-width="120px">
        <el-form-item label="选择数据源">
          <el-select v-model="inspectForm.datasource_id" placeholder="选择数据源" style="width:100%" clearable>
            <el-option v-for="ds in datasources" :key="ds.id" :label="ds.name" :value="ds.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="自定义URL">
          <el-input v-model="inspectForm.custom_url" placeholder="留空则使用数据源URL" clearable></el-input>
        </el-form-item>
        <el-form-item label="微信机器人Key">
          <el-input v-model="inspectForm.wechat_bot_key" placeholder="可选" clearable></el-input>
        </el-form-item>
        <el-form-item label="通知人员">
          <el-input v-model="inspectForm.touser" placeholder="企业微信邮箱，可选" clearable></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dialogInspectVisible = false">取消</el-button>
        <el-button type="primary" @click="triggerInspect" :loading="inspectLoading">开始巡检</el-button>
      </template>
    </el-dialog>

    <!-- DS Dialog -->
    <el-dialog v-model="dsDialogVisible" :title="dsForm.id ? '编辑数据源' : '新增数据源'" width="500px">
      <el-form :model="dsForm" label-width="100px">
        <el-form-item label="名称"><el-input v-model="dsForm.name" placeholder="例如: 生产集群"></el-input></el-form-item>
        <el-form-item label="URL"><el-input v-model="dsForm.url" placeholder="http://prometheus:9090"></el-input></el-form-item>
        <el-form-item label="用户名"><el-input v-model="dsForm.username" placeholder="可选"></el-input></el-form-item>
        <el-form-item label="密码"><el-input v-model="dsForm.password" type="password" placeholder="可选"></el-input></el-form-item>
        <el-form-item label="设为默认"><el-switch v-model="dsForm.is_default"></el-switch></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="dsDialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveDS">{{ dsForm.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>

    <!-- Import DS Dialog -->
    <el-dialog v-model="dsImportVisible" title="导入数据源 (YAML)" width="550px">
      <p style="font-size:13px;color:#909399;margin-bottom:12px">粘贴YAML格式的数据源配置：</p>
      <el-input type="textarea" v-model="dsImportYAML" :rows="10" placeholder="- name: cluster1&#10;  url: http://prometheus:9090&#10;  username: admin&#10;  password: admin"></el-input>
      <template #footer>
        <el-button @click="dsImportVisible = false">取消</el-button>
        <el-button type="primary" @click="importDatasources" :loading="dsImportLoading">导入</el-button>
      </template>
    </el-dialog>

    <!-- Notify Dialog -->
    <el-dialog v-model="notifyDialogVisible" :title="notifyForm.id ? '编辑通知渠道' : '新增通知渠道'" width="550px">
      <el-form :model="notifyForm" label-width="120px">
        <el-form-item label="类型">
          <el-select v-model="notifyForm.channel_type" placeholder="选择类型" style="width:100%">
            <el-option label="钉钉机器人" value="dingtalk"></el-option>
            <el-option label="邮件" value="email"></el-option>
            <el-option label="企业微信机器人" value="wechat_work"></el-option>
            <el-option label="企业微信应用" value="wechat_app"></el-option>
            <el-option label="飞书机器人" value="feishu"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="名称"><el-input v-model="notifyForm.name" placeholder="通知渠道名称"></el-input></el-form-item>
        <el-form-item label="配置 (JSON)">
          <el-input type="textarea" v-model="notifyForm.config_json" :rows="6" placeholder='{"webhook":"https://...","secret":"..."}'></el-input>
        </el-form-item>
        <el-form-item label="启用"><el-switch v-model="notifyForm.enabled"></el-switch></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="notifyDialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveNotify">{{ notifyForm.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>

    <!-- Cron Dialog -->
    <el-dialog v-model="cronDialogVisible" :title="cronForm.id ? '编辑定时任务' : '新增定时任务'" width="500px">
      <el-form :model="cronForm" label-width="120px">
        <el-form-item label="名称"><el-input v-model="cronForm.name" placeholder="例如: 每日巡检"></el-input></el-form-item>
        <el-form-item label="Cron表达式">
          <el-input v-model="cronForm.schedule" placeholder="00 08,17 * * *">
            <template #append><el-tooltip content="分 时 日 月 周" placement="top"><el-button>?</el-button></el-tooltip></template>
          </el-input>
        </el-form-item>
        <el-form-item label="数据源">
          <el-select v-model="cronForm.datasource_id" placeholder="全部数据源" style="width:100%" clearable>
            <el-option v-for="ds in datasources" :key="ds.id" :label="ds.name" :value="ds.id"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="启用"><el-switch v-model="cronForm.enabled"></el-switch></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="cronDialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveCron">{{ cronForm.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>

    <!-- MetricType Dialog -->
    <el-dialog v-model="mtDialogVisible" :title="mtForm.id ? '编辑指标类型' : '新增指标类型'" width="450px">
      <el-form :model="mtForm" label-width="100px">
        <el-form-item label="类型名称"><el-input v-model="mtForm.type_name" placeholder="例如: L1-基础设施层"></el-input></el-form-item>
        <el-form-item label="排序"><el-input-number v-model="mtForm.sort_order" :min="0"></el-input-number></el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="mtDialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveMetricType">{{ mtForm.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>

    <!-- MetricConfig Dialog -->
    <el-dialog v-model="mcDialogVisible" :title="mcForm.id ? '编辑指标' : '新增指标'" width="650px">
      <el-form :model="mcForm" label-width="120px">
        <el-form-item label="名称"><el-input v-model="mcForm.name" placeholder="CPU使用率监控"></el-input></el-form-item>
        <el-form-item label="描述"><el-input v-model="mcForm.description" placeholder="可选"></el-input></el-form-item>
        <el-form-item label="PromQL">
          <el-input type="textarea" v-model="mcForm.query" :rows="3" placeholder="avg(...)"></el-input>
        </el-form-item>
        <div style="display:flex;gap:12px">
          <el-form-item label="阈值" style="flex:1"><el-input-number v-model="mcForm.threshold" :min="0" :step="0.1" style="width:100%"></el-input-number></el-form-item>
          <el-form-item label="单位" style="flex:1"><el-input v-model="mcForm.unit" placeholder="%"></el-input></el-form-item>
        </div>
        <div style="display:flex;gap:12px">
          <el-form-item label="比较方式" style="flex:1">
            <el-select v-model="mcForm.threshold_type" style="width:100%">
              <el-option label="大于 (>)" value="greater"></el-option>
              <el-option label="大于等于 (>=)" value="greater_equal"></el-option>
              <el-option label="小于 (<)" value="less"></el-option>
              <el-option label="小于等于 (<=)" value="less_equal"></el-option>
              <el-option label="等于 (=)" value="equal"></el-option>
              <el-option label="不等于 (!=)" value="not_equal"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="告警级别" style="flex:1">
            <el-select v-model="mcForm.threshold_status" style="width:100%">
              <el-option label="严重 (critical)" value="critical"></el-option>
              <el-option label="警告 (warning)" value="warning"></el-option>
              <el-option label="正常 (normal)" value="normal"></el-option>
            </el-select>
          </el-form-item>
        </div>
        <el-form-item label="标签映射 (JSON)">
          <el-input type="textarea" v-model="mcForm.labels_json" :rows="2" placeholder='{"instance":"实例地址","job":"服务名"}'></el-input>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="mcDialogVisible = false">取消</el-button>
        <el-button type="primary" @click="saveMetricConfig">{{ mcForm.id ? '保存' : '创建' }}</el-button>
      </template>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    const { createApp, ref, reactive, computed, onMounted } = Vue;
    const api = axios.create({baseURL: '/api/v1'});

    const app = createApp({
      setup() {
        const activeMenu = ref('dashboard');
        const menuItems = [
          {key:'dashboard', label:'控制台', icon:'🏠'},
          {key:'datasources', label:'数据源管理', icon:'📡'},
          {key:'notifications', label:'通知渠道', icon:'🔔'},
          {key:'cronjobs', label:'定时任务', icon:'⏰'},
          {key:'reports', label:'报告管理', icon:'📄'},
          {key:'metrics', label:'指标配置', icon:'📊'},
          {key:'settings', label:'系统设置', icon:'⚙️'},
        ];
        const currentMenuLabel = computed(() => { const m = menuItems.find(i => i.key === activeMenu.value); return m ? m.label : ''; });

        const loading = reactive({datasources:false, notifications:false, cronjobs:false, reports:false, metrics:false});
        const datasources = ref([]);
        const notifications = ref([]);
        const cronjobs = ref([]);
        const reports = ref([]);
        const metricTypes = ref([]);
        const settings = ref({});
        const recentReports = ref([]);
        const stats = reactive({datasources:0, notifications:0, cronjobs:0, reports:0, metricTypes:0, metricConfigs:0});

        // Dialogs
        const dsDialogVisible = ref(false); const dsForm = ref({});
        const dsImportVisible = ref(false); const dsImportYAML = ref(''); const dsImportLoading = ref(false);
        const notifyDialogVisible = ref(false); const notifyForm = ref({channel_type:'dingtalk',enabled:false,config_json:'{}'});
        const cronDialogVisible = ref(false); const cronForm = ref({enabled:true});
        const dialogInspectVisible = ref(false); const inspectForm = ref({}); const inspectLoading = ref(false);
        const mtDialogVisible = ref(false); const mtForm = ref({sort_order:0});
        const mcDialogVisible = ref(false); const mcForm = ref({threshold:0,threshold_type:'greater',threshold_status:'critical',sort_order:0});
        let mcParentTypeId = null;

        const settingsForm = reactive({project_name:'',cron_schedule:'',report_cleanup_enabled_bool:false,report_cleanup_max_age_num:7,report_cleanup_cron:''});

        // Data fetching
        async function fetchDatasources() { loading.datasources = true; try { const r = await api.get('/datasources'); datasources.value = r.data; stats.datasources = r.data.length; } catch(e){} finally { loading.datasources = false; } }
        async function fetchNotifications() { loading.notifications = true; try { const r = await api.get('/notifications'); notifications.value = r.data; stats.notifications = r.data.length; } catch(e){} finally { loading.notifications = false; } }
        async function fetchCronJobs() { loading.cronjobs = true; try { const r = await api.get('/cronjobs'); cronjobs.value = r.data; stats.cronjobs = r.data.length; } catch(e){} finally { loading.cronjobs = false; } }
        async function fetchReports() { loading.reports = true; try { const r = await api.get('/reports'); reports.value = r.data; stats.reports = r.data.length; recentReports.value = r.data.slice(0,5); } catch(e){} finally { loading.reports = false; } }
        async function fetchMetrics() { loading.metrics = true; try { const r = await api.get('/metrics/types'); metricTypes.value = r.data; stats.metricTypes = r.data.length; let c = 0; r.data.forEach(mt => { if(mt.configs) c += mt.configs.length; }); stats.metricConfigs = c; } catch(e){} finally { loading.metrics = false; } }
        async function fetchSettings() { try { const r = await api.get('/settings'); settings.value = r.data; settingsForm.project_name = r.data.project_name || ''; settingsForm.cron_schedule = r.data.cron_schedule || ''; settingsForm.report_cleanup_enabled_bool = r.data.report_cleanup_enabled === 'true'; settingsForm.report_cleanup_max_age_num = parseInt(r.data.report_cleanup_max_age) || 7; settingsForm.report_cleanup_cron = r.data.report_cleanup_cron || ''; } catch(e){} }

        async function loadAll() { await Promise.all([fetchDatasources(), fetchNotifications(), fetchCronJobs(), fetchReports(), fetchMetrics(), fetchSettings()]); }

        // CRUD: Data Sources
        function editDS(row) { dsForm.value = {...row}; dsDialogVisible.value = true; }
        async function saveDS() {
          try {
            if (dsForm.value.id) { await api.put('/datasources/' + dsForm.value.id, dsForm.value); } else { await api.post('/datasources', dsForm.value); }
            dsDialogVisible.value = false; await fetchDatasources(); ElementPlus.ElMessage.success('保存成功');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }
        async function deleteDS(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除数据源 "' + row.name + '"?'); await api.delete('/datasources/' + row.id); await fetchDatasources(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }
        async function importDatasources() {
          dsImportLoading.value = true;
          try { const r = await api.post('/datasources/import', {yaml_content: dsImportYAML.value}); ElementPlus.ElMessage.success(r.data.message); dsImportVisible.value = false; dsImportYAML.value = ''; await fetchDatasources(); } catch(e) { ElementPlus.ElMessage.error('导入失败'); } finally { dsImportLoading.value = false; }
        }

        // CRUD: Notifications
        function editNotify(row) { notifyForm.value = {...row}; notifyDialogVisible.value = true; }
        async function saveNotify() {
          try {
            if (notifyForm.value.id) { await api.put('/notifications/' + notifyForm.value.id, notifyForm.value); } else { await api.post('/notifications', notifyForm.value); }
            notifyDialogVisible.value = false; await fetchNotifications(); ElementPlus.ElMessage.success('保存成功');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }
        async function deleteNotify(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除通知渠道 "' + row.name + '"?'); await api.delete('/notifications/' + row.id); await fetchNotifications(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }
        async function updateNotify(row) { try { await api.put('/notifications/' + row.id, row); } catch(e){} }
        async function testNotify(row) {
          try { await api.post('/notifications/test', {id: row.id}); ElementPlus.ElMessage.success('测试通知已发送'); } catch(e) { ElementPlus.ElMessage.error('发送失败'); }
        }

        // CRUD: Cron Jobs
        function editCron(row) { cronForm.value = {...row}; cronDialogVisible.value = true; }
        async function saveCron() {
          try {
            if (cronForm.value.id) { await api.put('/cronjobs/' + cronForm.value.id, cronForm.value); } else { await api.post('/cronjobs', cronForm.value); }
            cronDialogVisible.value = false; await fetchCronJobs(); ElementPlus.ElMessage.success('保存成功');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }
        async function deleteCron(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除定时任务 "' + row.name + '"?'); await api.delete('/cronjobs/' + row.id); await fetchCronJobs(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }
        async function updateCron(row) { try { await api.put('/cronjobs/' + row.id, row); } catch(e){} }

        // CRUD: Reports
        function viewReport(row) {
          if (row.file_path) {
            const name = row.file_path.replace('reports/', '');
            window.open('/api/promai/reports/' + name, '_blank');
          }
        }
        async function deleteReport(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除此报告?'); await api.delete('/reports/' + row.id); await fetchReports(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }

        // CRUD: Metrics
        function editMetricType(row) { mtForm.value = {...row}; mtDialogVisible.value = true; }
        async function saveMetricType() {
          try {
            if (mtForm.value.id) { await api.put('/metrics/types/' + mtForm.value.id, mtForm.value); } else { await api.post('/metrics/types', mtForm.value); }
            mtDialogVisible.value = false; await fetchMetrics(); ElementPlus.ElMessage.success('保存成功');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }
        async function deleteMetricType(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除指标类型 "' + row.type_name + '"? 其下所有指标配置也将被删除。'); await api.delete('/metrics/types/' + row.id); await fetchMetrics(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }
        function addMetricConfig(mt) { mcParentTypeId = mt.id; mcForm.value = {metric_type_id: mt.id, threshold:0, threshold_type:'greater', threshold_status:'critical'}; mcDialogVisible.value = true; }
        function editMetricConfig(row) { mcForm.value = {...row}; mcDialogVisible.value = true; }
        async function saveMetricConfig() {
          try {
            if (mcForm.value.id) { await api.put('/metrics/configs/' + mcForm.value.id, mcForm.value); } else { await api.post('/metrics/configs', mcForm.value); }
            mcDialogVisible.value = false; await fetchMetrics(); ElementPlus.ElMessage.success('保存成功');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }
        async function deleteMetricConfig(row) {
          try { await ElementPlus.ElMessageBox.confirm('确定删除指标 "' + row.name + '"?'); await api.delete('/metrics/configs/' + row.id); await fetchMetrics(); ElementPlus.ElMessage.success('已删除'); } catch(e){}
        }

        // Inspect
        async function triggerInspect() {
          inspectLoading.value = true;
          try {
            const r = await api.post('/inspect', {
              datasource_id: inspectForm.value.datasource_id || 0,
              datasource_url: inspectForm.value.custom_url || '',
              wechat_bot_key: inspectForm.value.wechat_bot_key || '',
              touser: inspectForm.value.touser || ''
            });
            dialogInspectVisible.value = false;
            ElementPlus.ElMessage.success('巡检完成！');
            if (r.data.url) { setTimeout(() => window.open(r.data.url, '_blank'), 500); }
            await fetchReports();
          } catch(e) {
            const msg = e.response && e.response.data && e.response.data.error ? e.response.data.error : '巡检失败';
            ElementPlus.ElMessage.error(msg);
          } finally { inspectLoading.value = false; }
        }

        // Settings
        async function saveSettings() {
          try {
            await api.put('/settings', {
              project_name: settingsForm.project_name,
              cron_schedule: settingsForm.cron_schedule,
              report_cleanup_enabled: settingsForm.report_cleanup_enabled_bool ? 'true' : 'false',
              report_cleanup_max_age: String(settingsForm.report_cleanup_max_age_num),
              report_cleanup_cron: settingsForm.report_cleanup_cron
            });
            ElementPlus.ElMessage.success('设置已保存');
          } catch(e) { ElementPlus.ElMessage.error('保存失败'); }
        }

        function handleRefresh() { loadAll(); ElementPlus.ElMessage.info('已刷新'); }
        function goHome() { window.location.href = '/api/promai/'; }
        function formatTime(t) { if (!t) return '-'; try { const d = new Date(t); return d.toLocaleString('zh-CN', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e) { return t; } }

        onMounted(() => { loadAll(); });

        return {
          activeMenu, menuItems, currentMenuLabel, loading,
          datasources, notifications, cronjobs, reports, metricTypes, settings, recentReports, stats,
          dsDialogVisible, dsForm, dsImportVisible, dsImportYAML, dsImportLoading,
          notifyDialogVisible, notifyForm,
          cronDialogVisible, cronForm,
          dialogInspectVisible, inspectForm, inspectLoading,
          mtDialogVisible, mtForm, mcDialogVisible, mcForm,
          settingsForm,
          editDS, saveDS, deleteDS, importDatasources,
          editNotify, saveNotify, deleteNotify, updateNotify, testNotify,
          editCron, saveCron, deleteCron, updateCron,
          viewReport, deleteReport,
          editMetricType, saveMetricType, deleteMetricType,
          addMetricConfig, editMetricConfig, saveMetricConfig, deleteMetricConfig,
          triggerInspect, saveSettings, handleRefresh, goHome, formatTime
        };
      }
    });
    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
